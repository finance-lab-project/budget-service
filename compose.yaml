name: budget-service-local

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:ed9475dab2438f7a8ee063fa29a0740e7fbf7185e5549db1866eb722f12b49f8
    environment:
      POSTGRES_DB: budget_local
      POSTGRES_USER: budget_local
      # Synthetic credentials for this isolated local database only.
      POSTGRES_PASSWORD: budget-local-only
    ports:
      - "127.0.0.1:${BUDGET_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget_local -d budget_local"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  postgres-data:
