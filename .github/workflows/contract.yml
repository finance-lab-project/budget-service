name: Budget v1 contract

on:
  pull_request:
    paths:
      - 'api/**'
      - 'docs/api-v1-contract.md'
      - 'docs/evidence/issue-3/**'
      - 'fixtures/api-v1/**'
      - 'scripts/check_contract.py'
      - 'requirements-contract.txt'
      - '.python-version'
      - 'internal/budget/totals.go'
      - '.github/workflows/contract.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'docs/api-v1-contract.md'
      - 'docs/evidence/issue-3/**'
      - 'fixtures/api-v1/**'
      - 'scripts/check_contract.py'
      - 'requirements-contract.txt'
      - '.python-version'
      - 'internal/budget/totals.go'
      - '.github/workflows/contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - name: Install pinned contract tooling
        run: python -m pip install -r requirements-contract.txt
      - name: Validate contract and fixtures
        run: python scripts/check_contract.py
